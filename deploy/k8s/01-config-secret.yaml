# 01-config-secret.yaml
# 面试讲解：
#   ConfigMap  放非敏感配置（端口、服务名等）
#   Secret     放敏感信息（密码、JWT 密钥），生产建议 Sealed Secret / Vault
#   使用 Kustomize / Helm 时，这里的字符串通过 patch 从 CI secrets 注入，不直接进 git
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: taotao-config
  namespace: taotao-mall
data:
  NODE_ENV: "production"
  PORT: "3000"
  MONGO_DB: "taotao_mall"
  MONGO_HOST: "taotao-mongo.taotao-mall.svc.cluster.local"
  MONGO_PORT: "27017"
  REDIS_HOST: "taotao-redis.taotao-mall.svc.cluster.local"
  REDIS_PORT: "6379"
  JWT_EXPIRES_IN: "7d"
  UPLOAD_PATH: "/app/uploads"
---
# ❗ 生产环境请用 kubeseal / SealedSecrets，或外部 Vault
#    这里只是示例格式（base64 不是加密）
#    命令：echo -n "xxx" | base64
apiVersion: v1
kind: Secret
metadata:
  name: taotao-secret
  namespace: taotao-mall
type: Opaque
data:
  # root:taotao_root_pwd_2026  (仅示例)
  MONGO_ROOT_USER: cm9vdA==
  MONGO_ROOT_PASS: dGFvdGFvX3Jvb3RfcHdkXzIwMjY=
  # taotao_redis_pwd_2026
  REDIS_PASSWORD:  dGFvdGFvX3JlZGlzX3B3ZF8yMDI2
  # taotao-mall-jwt-secret-change-me!
  JWT_SECRET:       dGFvdGFvLW1hbGwtand0LXNlY3JldC1jaGFuZ2UtbWUh
  # sk_test_xxx
  STRIPE_SECRET_KEY: c2tfdGVzdF94eHg=

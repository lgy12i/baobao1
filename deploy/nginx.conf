# =============================================================
# Nginx 配置 —— 为前端 React SPA + 后端 API 反向代理准备
# 关键作用：
#   1. SPA 路由刷新 404 问题 → try_files $uri /index.html
#   2. /api 路径反代到后端服务（容器内用服务名 backend:3000）
#   3. 静态资源强缓存（带 hash 的 js/css 一年过期，html 不缓存）
#   4. Gzip 压缩 + HTTP2 友好
# =============================================================

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # 字符集与日志
    charset utf-8;
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # ================ Gzip 压缩 ================
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1k;
    gzip_proxied any;
    gzip_vary on;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/ttf
        font/otf;

    # ================ 后端 API 反向代理 ================
    # 关键：前端代码里 axios baseURL 写 /api/v1 就会走这里
    #       域名不变，避免 CORS
    location /api/ {
        proxy_pass         http://backend:3000;   # 指向 docker-compose 里的 backend 服务名
        proxy_http_version 1.1;

        # 透传客户端真实 IP / Host / Scheme
        proxy_set_header   Host               $host;
        proxy_set_header   X-Real-IP          $remote_addr;
        proxy_set_header   X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto  $scheme;

        # 超时设置（长请求，比如生成报表等）
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;
    }

    # ================ 上传文件静态资源代理（后端 /uploads） ================
    # 如果后端上传文件保存在本地 /app/uploads，这里反代让浏览器可访问
    location /uploads/ {
        proxy_pass         http://backend:3000;
        proxy_set_header   Host               $host;
        expires            7d;                # 图片7天强缓存
        add_header         Cache-Control "public, max-age=604800, immutable";
    }

    # ================ Vite 打包资源的精准缓存 ================
    # Vite 产物：
    #  index.html                  → 永远不缓存（因为 hash 变化会改引用）
    #  /assets/*.js / *.css / *.png → 带 hash，可长期缓存（1年）
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
        try_files $uri =404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # 其他静态资源（favicon.ico 等）
    location ~* \.(?:ico|svg|woff2?|ttf|eot|png|jpg|jpeg|gif|webp)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    # ================ SPA 路由兜底 ================
    # 非常关键：/cart /orders/:id 这类路由，Nginx 本地没有文件，必须回到 index.html
    #           否则刷新页面会 404
    location / {
        try_files $uri $uri/ /index.html;
    }
}
